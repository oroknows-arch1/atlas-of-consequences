<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>AOC-002 | The Ground Beneath the Rig</title><style>:root{color-scheme:dark;font-family:system-ui,-apple-system,sans-serif;background:#090f13;color:#f2eee6}*{box-sizing:border-box}body{margin:0}main{min-height:100svh;display:flex;flex-direction:column;padding:clamp(18px,4vw,48px);max-width:960px;margin:auto}header,nav,.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between}header{border-bottom:1px solid #405056;padding-bottom:14px}small,.eyebrow{color:#a8b7b8;letter-spacing:.08em}h1{font-size:clamp(2.1rem,7vw,5rem);line-height:1.06;margin:22px 0}h2{font-size:clamp(1.5rem,5vw,2.8rem)}p{line-height:1.6;max-width:64ch}section{flex:1;display:flex;flex-direction:column;justify-content:center;padding:25px 0}button{background:transparent;border:1px solid #71848a;color:#fff;border-radius:7px;padding:13px 17px;font:inherit;cursor:pointer;text-align:left}button:hover,button:focus-visible{background:#263b40;outline:2px solid #a5d5c3}button.primary{background:#c9dfd2;color:#0a1718;border-color:#c9dfd2;font-weight:650}.choices{display:grid;gap:12px;margin:22px 0}.choice strong{display:block;margin-bottom:5px}.choice[aria-pressed=true]{border-color:#c9dfd2;background:#1c3a38}.panel{border-left:3px solid #c9dfd2;padding:15px 20px;background:#18272a;margin:15px 0}.hidden{display:none!important}.tag{font-size:.75rem;text-transform:uppercase;letter-spacing:.09em;color:#c9dfd2}.foot{font-size:.8rem;color:#a8b7b8;border-top:1px solid #405056;padding-top:15px}nav button{font-size:.85rem;padding:9px}#progress{color:#b7c9c5}a{color:#c9dfd2}@media(prefers-reduced-motion:no-preference){section{animation:fade .2s ease-out}@keyframes fade{from{opacity:.5}to{opacity:1}}}</style><main><header><div><small>ATLAS OF CONSEQUENCES / EDITION 002</small><div class="tag">Hypothetical reconstruction · production prototype</div></div><button id="home">Perspectives</button></header><nav aria-label="Reader sections"><button data-view="real">What's real</button><button data-view="story">Story</button><button data-view="consequences">Consequences</button><button data-view="place">Place</button><button data-view="sources">Sources</button></nav><section id="screen" aria-live="polite"></section><div class="foot">Unverified client account · Fictional composite characters · No incident footage · No real company identified</div></main><script>
const scenes=[
{id:'civil',name:'Civil site supervisor',heading:'Before the rig moves',intro:'The location is ready for handover. At least, that is what the schedule says. What would you do before signing?',next:['engineer','crew','liaison'],options:[['Ask for the evidence','The handover pauses while ground assessments, construction records and rig loads are checked. A mismatch might be caught before mobilisation.'],['Accept the handover','Mobilisation may proceed sooner, but unresolved assumptions travel with the paperwork. A failure is not inevitable.'],['Escalate the uncertainty','Responsibility becomes explicit, but a meeting cannot substitute for technical verification.']]},
{id:'crew',name:'Drilling crew member',heading:'An uncertain warning',intro:'You notice something that concerns you. It does not prove a foundation failure. What happens next?',next:['engineer','liaison','civil'],options:[['Stop and report','Operations pause while qualified staff assess the observation.'],['Request another assessment','A second review may clarify the concern, subject to site safety procedures.'],['Continue under instructions','Work continues, but an unresolved concern remains. This does not establish an accident.']]},
{id:'engineer',name:'Wellsite engineer',heading:'What would make restart safe?',intro:'A rig has reportedly settled. The technical cause is unknown. What do you prioritise?',next:['civil','crew','liaison'],options:[['Review ground and loads','Restart depends on evidence about ground capacity, rig loads and site condition.'],['Secure the area','Personnel safety comes first while the condition is assessed.'],['Reconcile contractor records','A joint record clarifies the questions, but cannot replace engineering verification.']]},
{id:'logistics',name:'Local logistics provider',heading:'The work stops',intro:'Your deliveries may be interrupted. The effect on your business is fictional, not a documented loss.',next:['resident','civil','engineer'],options:[['Redeploy vehicles','Other work may protect income but add costs and travel.'],['Keep capacity reserved','A quick restart could be served, but idle time may reduce cash flow.'],['Request a revised schedule','Clearer information helps planning, though no date is guaranteed.']]},
{id:'resident',name:'Nearby resident',heading:'Questions beyond the fence',intro:'You hear conflicting accounts. No contamination, injury or displacement has been established.',next:['liaison','logistics','civil'],options:[['Ask for a briefing','The community asks what happened, what is unknown and how updates will be shared.'],['Document observations','Records may help distinguish evidence from rumours without proving impacts.'],['Organise neighbours’ questions','Residents focus on access, traffic and safeguards without assuming a spill.']]},
{id:'liaison',name:'Contractor liaison',heading:'One concern, several teams',intro:'People from different companies need to understand the same technical concern. How do you communicate it?',next:['engineer','civil','crew'],options:[['Translate and confirm','Each party restates the concern before a decision is made.'],['Create an action register','Questions, owners and deadlines become visible; signatures do not verify engineering assumptions.'],['Escalate to decision makers','The concern reaches authorised personnel while safety controls remain in place.']]}];
let view='intro',current='civil';const choices={};const screen=document.getElementById('screen');function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}function btn(label,fn,primary=false){const b=document.createElement('button');b.textContent=label;if(primary)b.className='primary';b.addEventListener('click',fn);return b}function show(v){view=v;render()}function add(tag,text,cls){const e=document.createElement(tag);e.textContent=text;if(cls)e.className=cls;screen.append(e);return e}function render(){screen.replaceChildren();if(view==='intro'){add('div','A STORY ABOUT THE GROUND WE TRUST','eyebrow');add('h1','The Ground Beneath the Rig');add('p','In a fictionalised onshore Niger Delta drilling scenario, a platform gives way. Six people face different decisions. What changes when you see through their eyes?');add('p','Based on an unverified client account. Not a reconstruction of an authenticated incident.');screen.append(btn('Enter the story',()=>show('story'),true),btn('Skip introduction · choose a perspective',()=>show('story')));return}if(view==='story'){add('div','CHOOSE A PERSPECTIVE','eyebrow');add('h2','Six people. Different consequences.');const list=document.createElement('div');list.className='choices';scenes.forEach(s=>list.append(btn(s.name+(choices[s.id]?' · choice recorded':''),()=>{current=s.id;show('scene')})));screen.append(list);return}if(view==='scene'){const s=scenes.find(x=>x.id===current);add('div',s.name.toUpperCase()+' · FICTIONAL','tag');add('h2',s.heading);add('p',s.intro);const list=document.createElement('div');list.className='choices';s.options.forEach((o,i)=>{const b=btn(String.fromCharCode(65+i)+' — '+o[0],()=>{choices[s.id]=i;show('outcome')});b.setAttribute('aria-pressed',choices[s.id]===i?'true':'false');list.append(b)});screen.append(list,btn('Back to perspectives',()=>show('story')));return}if(view==='outcome'){const s=scenes.find(x=>x.id===current),i=choices[s.id];if(i===undefined){show('scene');return}add('div','POSSIBLE CONSEQUENCE · FICTIONAL','tag');add('h2',s.options[i][0]);add('p',s.options[i][1],'panel');add('p','This choice explores a possibility; it does not establish what occurred or who was responsible.');screen.append(btn('Follow another perspective',()=>{current=s.next[i];show('scene')},true),btn('Change this decision',()=>show('scene')),btn('See all consequences',()=>show('consequences')));return}if(view==='consequences'){add('div','YOUR DECISIONS','eyebrow');add('h2','Possible consequences');let n=0;scenes.forEach(s=>{const i=choices[s.id];if(i!==undefined){n++;add('h3',s.name+' — '+s.options[i][0]);add('p',s.options[i][1])}});if(!n)add('p','Choose a character to see how different decisions might change the story.');screen.append(btn('Explore perspectives',()=>show('story'),true));return}if(view==='real'){add('div','EVIDENCE BOUNDARY','eyebrow');add('h2',"What's real?");add('p','The client supplied an unverified account of an onshore drilling-pad failure in the Eastern Niger Delta. The operator, contractors and exact site have not been authenticated.');add('p','The six characters, their conversations and their choices are fictional. The story does not establish a cause, injury, pollution or liability.');screen.append(btn('Enter the story',()=>show('story'),true));return}if(view==='place'){add('div','REGIONAL CONTEXT · NOT INCIDENT SITE','tag');add('h2','Eastern Niger Delta, Nigeria');add('p','The region includes waterways, floodplains and other varied environments. The exact drilling location is unknown; no particular village, wetland or terrain is presented as the incident site.');screen.append(btn('Explore perspectives',()=>show('story')));return}if(view==='sources'){add('div','SOURCE REGISTER','eyebrow');add('h2','What supports this story?');add('p','Client-supplied incident scenario: unverified, anonymous, not independently authenticated.');add('p','Engineering context: API RP 4G guidance on drilling structures and foundations; consult the authoritative standard before publication.');add('p','Regional environment: IUCN Niger Delta ecosystem report (2024) and Nigeria UNFCCC reporting. No footage is incorporated in this prototype.');const a=document.createElement('a');a.href='https://portals.iucn.org/library/efiles/documents/2024-014-En.pdf';a.target='_blank';a.rel='noopener noreferrer';a.textContent='IUCN Niger Delta report';screen.append(a,btn('Return to story',()=>show('story')))}}document.querySelectorAll('[data-view]').forEach(b=>b.addEventListener('click',()=>show(b.dataset.view)));document.getElementById('home').addEventListener('click',()=>show('story'));render();</script></html>
