schema_version: "0.2"
manifest_role: "active production contract"
manifest_reconciled: "2026-09-25"

edition:
  id: "AOC-001"
  ecosystem_id: "AOC-ECO-0001"
  title: "AI's Physical Hunger"
  status: "distribution candidate assembled / publication QA rerun pending / release blocked"
  reader_path:
    - whats_real
    - story
    - consequences
    - place
    - sources
  constitutional_rule: "Facts can change the fiction. Fiction must never quietly become fact."
  guiding_question: "What does providing for your family mean when the opportunity that helps you provide also asks for more of your absence?"
  locality:
    city: "Calama"
    region: "Antofagasta Region"
    country: "Chile"

source_of_truth:
  master_edition: "content/AOC-001/master-edition-v0.1.md"
  publication_audit: "content/AOC-001/master-edition-publication-audit-v0.1.md"
  evidence_register: "content/AOC-001/sources/publication-source-register-v0.1.md"
  constitution: "docs/atlas-constitution.md"
  reader_approval: "content/AOC-001/media/AOC001-READER-APPROVAL.md"
  publication_qa: "content/AOC-001/publication-qa-v0.1.md"
  manifest_reconciliation: "content/AOC-001/manifest-reconciliation-note-2026-09-25.md"
  distribution_rules: "content/AOC-001/distribution/README.md"
  distribution_candidate: "content/AOC-001/distribution/distribution-candidate-v0.1.md"
  orok_rules: "content/AOC-001/orok/README.md"
  live_reader: "public/index.html"
  reader_publication_css: "public/reader-publication-treatments.css"
  reader_publication_js: "public/reader-publication-treatments.js"

content_lock:
  story: true
  reader_sequence: true
  fact_fiction_boundary: true
  causal_boundary: true
  locality: true
  consequence_mechanism: true
  source_register: true
  narrative_rewrite_allowed: false

certainty_model:
  - id: documented_global
    label: "Documented global mechanism"
    meaning: "Sourced real-world mechanism."
    visual_rule: "Use factual/documentary or clearly explanatory material only. Never imply a local consequence that the evidence does not establish."
  - id: documented_place
    label: "Documented place connection"
    meaning: "Sourced connection between copper, Chile, Antofagasta, Calama and Chuquicamata."
    visual_rule: "Use verifiable place, infrastructure, mapping and operational context. Do not imply that AI caused a specific local project or job."
  - id: fictional_human
    label: "Fictional human exploration"
    meaning: "Daniela, Mauricio, Tomás, Emilia, Elena and their events are invented."
    visual_rule: "Generated or staged fictional visuals are allowed only with persistent STORY / FICTION treatment. Never present fictional people or scenes as documentary evidence."

approved_reader_system:
  status: "approved_2026-09-24"
  preserve_during_remediation: true
  live_surface: "public/index.html"
  opening:
    asset: "public/assets/aoc001-report-video-candidate-v0.4.mp4"
    mode: "factual film only"
    status: "approved"
    autoplay: "immediate; muted where browser policy requires"
    sound_control: "small Tap for sound control"
    skip_control: true
    failure_policy: "fail open into reader"
    final_frame_hold: true
    transition: "final factual frame visibly recedes into the reader"
    story_promo_auto_play: false
  reader_background:
    source: "same approved factual film"
    behavior: "persistent full-screen scroll-driven scrub layer"
    object_fit: "cover"
    approved_reader_brightness: 0.67
    approved_reader_opacity: 0.82
    darker_previous_reader_brightness_retired: 0.43
  soundtrack:
    approval: "approved for testing"
    role: "restrained supporting bed only"
    rule: "must never compete with visuals, speech, captions, evidence or story"
  reduced_motion:
    required: true
    implementation_status: "implemented in reader / publication QA rerun pending"
    static_asset: "public/assets/aoc001-report-video-candidate-v0.4-review.jpg"
    behavior: "video hidden, static factual-film frame retained, reader entered immediately, normal text navigation preserved"
    target: "static factual-film fallback with normal reader access; never require moving/scrubbed video"

separate_media_assets:
  factual_report_video:
    id: "AOC001-REPORT-VIDEO"
    status: "approved"
    role: "automatic factual opening + scroll-scrub visual memory + standalone factual derivative"
    approval_record: "content/AOC-001/media/AOC001-REPORT-VIDEO-APPROVAL.md"
    provenance: "content/AOC-001/sources/report-video-v0.4-asset-register.md"
  story_promo:
    id: "AOC001-STORY-PROMO"
    status: "approved separate fiction/distribution asset"
    role: "optional cinematic fiction teaser; not part of automatic reader opening"
    label_required: "STORY / FICTION"
    approval_record: "content/AOC-001/media/AOC001-STORY-PROMO-APPROVAL.md"
  atlas_soundtrack:
    status: "approved for testing"
    role: "low supporting sonic signature"
    approval_record: "content/AOC-001/media/AOC001-ATLAS-SOUNDTRACK-APPROVAL.md"
  visual_character_reference_set:
    status: "approved internal continuity baseline"
    public_character_bible: false
    approval_record: "content/AOC-001/media/AOC001-VISUAL-CHARACTER-APPROVAL.md"

retired_active_instructions:
  - "10–15 second hybrid edition trailer as required reader opening"
  - "automatic factual-video to story-promo opening sequence"
  - "ENTER THE REPORT / ENTER THE STORY gate before the reader"
  - "required / not yet produced status for the factual report video"
  - "required / not yet produced status for the story promo"
  - "empty required asset slots for media already produced and approved"
  - "asset acquisition as the next foreground action"
  - "mobile web assembly as not yet started"
  - "rejected still-image opening prototype"

sections:
  whats_real:
    display_label: "WHAT'S REAL"
    mode: "factual"
    certainty: "documented_global + documented_place"
    content_source: "master-edition-v0.1.md#WHAT'S REAL"
    integration_status: "complete / locked master text + key factual callouts integrated"
    evidence_ids: [SR-01, SR-02, SR-03, SR-04, SR-05, SR-06, SR-07, SR-08, SR-10]
    required_web_treatment:
      - "short mobile paragraphs"
      - "key-number callouts: 415 TWh, ~1.5%, 58%, ~15 km"
      - "visual consequence chain rather than repeated arrow prose"
      - "motion becomes quieter once long-form reading begins"
  story:
    display_label: "STORY — FICTION"
    mode: "fiction"
    certainty: "fictional_human"
    content_source: "master-edition-v0.1.md#STORY — FICTION"
    integration_status: "complete / locked story + fiction disclosure + scene breaks integrated"
    fictional_people: [Daniela, Mauricio, Tomás, Emilia, Elena]
    required_web_treatment:
      - "persistent or obvious STORY / FICTION label"
      - "fiction disclosure before first story paragraph"
      - "preserve short paragraphs and scene breaks"
      - "no factual cards inserted into the fiction"
      - "do not make the household look like a documentary case study"
  consequences:
    display_label: "CONSEQUENCES"
    mode: "analysis"
    content_source: "master-edition-v0.1.md#CONSEQUENCES"
    integration_status: "complete / locked text + three-layer certainty treatment + prohibited-shortcut boundary integrated"
    certainty_layers: [documented_global, documented_place, fictional_human]
    required_web_treatment:
      - "compact visual consequence map"
      - "three visibly separated certainty levels"
      - "make the prohibited shortcut visually distinct"
    prohibited_shortcut: "AI boom -> mine expands -> Mauricio gets promoted"
  place:
    display_label: "PLACE"
    mode: "factual_context"
    content_source: "master-edition-v0.1.md#PLACE"
    integration_status: "complete / locked place text + real-location treatment integrated"
    evidence_ids: [SR-09, SR-10, SR-11, SR-12, SR-13, SR-14, SR-15, SR-16]
    required_web_treatment:
      - "map/location treatment"
      - "city facts separated from story"
      - "show Calama as a city, not an empty desert settlement attached to a mine"
      - "preserve Indigenous sourcing boundary"
  sources:
    display_label: "SOURCES"
    mode: "evidence"
    content_source: "sources/publication-source-register-v0.1.md"
    integration_status: "complete / master source surface + SR-01 through SR-16 inspectable cards integrated"
    required_web_treatment:
      - "scannable/collapsible evidence cards"
      - "direct source links"
      - "source role and limitation visible where useful"
      - "quieter/static visual state"

orok_companion:
  status: "unresolved release-scope item after publication QA"
  source_rules: "content/AOC-001/orok/README.md"
  rule: "Do not treat OROK companion production as complete or silently drop it; resolve scope before release human gate."

distribution_pack:
  status: "candidate_v0.1 assembled / publication QA pending"
  candidate: "content/AOC-001/distribution/distribution-candidate-v0.1.md"
  permanent_destination: "https://atlas-of-consequences.onrender.com/"
  rule: "Derive only from the verified master edition; do not invent separate factual claims."
  expected_outputs:
    - "standalone factual report clip"
    - "standalone STORY / FICTION promo"
    - "vertical social cuts where useful"
    - "still/carousel derivatives"
    - "captions"
    - "headlines/descriptions"
    - "thumbnail/poster frames"
    - "links back to permanent Atlas edition"

production_pipeline:
  - id: P1
    stage: "content_lock"
    status: "complete"
  - id: P2
    stage: "edition_manifest"
    status: "reconciled_to_current_truth_2026-09-25"
  - id: P3
    stage: "core_media_generation"
    status: "complete for approved factual film, story promo, soundtrack test and visual reference set"
  - id: P4
    stage: "core_media_editorial_verification"
    status: "complete for approved media assets"
  - id: P5
    stage: "approved opening_to_reader_system"
    status: "complete and human approved"
  - id: P6
    stage: "mobile_reader_build"
    status: "complete / full master and required publication treatments integrated / QA rerun pending"
  - id: P7
    stage: "distribution_derivatives"
    status: "complete / candidate_v0.1 assembled from approved media and locked master"
  - id: P8
    stage: "publication_QA"
    status: "failed_2026-09-25 / rerun now required against remediated reader + distribution candidate"
  - id: P9
    stage: "release_human_approval"
    status: "blocked"
  - id: P10
    stage: "publish"
    status: "blocked"

publication_gates:
  - "Every material factual claim remains wired to the publication source register."
  - "A fast-scrolling phone reader cannot mistake fiction for reportage."
  - "No image or clip silently converts fiction into documentary evidence."
  - "No factual image implies a stronger causal chain than the evidence supports."
  - "Real-world assets have provenance and sufficient publication/reuse rights."
  - "Place imagery represents Calama as a lived city as well as a mining locality."
  - "Sensitive or cultural representation receives explicit human editorial review."
  - "Factual opening and separate Story promo remain distinguishable assets with clear roles."
  - "Mobile performance has a reduced-motion/static fallback and fail-open reader access."
  - "Social derivatives point back to the permanent Atlas edition and preserve fact/fiction labels."
  - "The live reader contains the complete locked Master Edition, not skeleton summaries."

next_foreground_action:
  id: "AOC001-PUBLICATION-QA-RERUN"
  action: "Rerun the full AOC-001 publication QA across the complete live reader and distribution candidate."
  verify:
    - "locked Master Edition is complete in the live reader"
    - "reader visual/interaction approval has not regressed"
    - "reduced-motion and fail-open behavior work"
    - "SR-01 through SR-16 remain inspectable"
    - "factual and fictional distribution branches are unmistakably separated"
    - "distribution claims remain inside the evidence and causal boundaries"
    - "all distribution paths return to the permanent Atlas edition"
    - "remaining release-scope blockers, including OROK companion scope, are explicitly resolved or carried to the human release gate"
  do_not_do:
    - "rewrite the locked story"
    - "redesign the approved reader"
    - "invent new factual claims"
    - "generate new paid media unless QA demonstrates a genuine blocker"
    - "advance to release or publish unless Publication QA passes"
