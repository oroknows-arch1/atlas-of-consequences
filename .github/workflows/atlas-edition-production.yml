name: Atlas edition production candidate
on:
  push:
    branches: [test/automated-edition-1]
    paths:
      - '.github/workflows/atlas-edition-production.yml'
      - 'tools/**'
      - 'content/AUTOMATED-TEST-001/**'
  workflow_dispatch:
    inputs:
      run_dir:
        description: Repository directory with approved candidate and stage receipts
        required: true
        default: content/AUTOMATED-TEST-001
jobs:
  produce-and-review:
    if: github.ref == 'refs/heads/test/automated-edition-1'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      OPENAI_API_KEY: ${{ secrets.ATLAS_OPENAI_API_KEY }}
      RENDER_API_KEY: ${{ secrets.ATLAS_RENDER_API_KEY }}
      ATLAS_IMAGE_COMMAND: python3 tools/image_provider_openai.py
      ATLAS_VISUAL_QA_COMMAND: python3 tools/visual_verifier_openai.py
      ATLAS_BENCHMARK_URL: https://atlas-of-consequences.onrender.com/adaptive/
      NODE_PATH: /tmp/atlas-playwright/node_modules
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/automated-edition-1
          persist-credentials: true
      - name: Verify production capabilities
        run: |
          test -n "$OPENAI_API_KEY" || { echo 'BLOCKED: ATLAS_OPENAI_API_KEY is missing'; exit 1; }
          test -n "$RENDER_API_KEY" || { echo 'BLOCKED: ATLAS_RENDER_API_KEY is missing'; exit 1; }
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image and browser dependencies
        run: |
          python3 -m pip install Pillow
          npm install --prefix /tmp/atlas-playwright playwright
          /tmp/atlas-playwright/node_modules/.bin/playwright install --with-deps chromium
      - name: Produce actual assets and reader
        run: python3 tools/produce_edition.py "$RUN_DIR"
        env:
          RUN_DIR: ${{ inputs.run_dir || 'content/AUTOMATED-TEST-001' }}
      - name: Persist binaries and reader on test branch
        run: |
          git config user.name "atlas-production-worker"
          git config user.email "atlas-production-worker@users.noreply.github.com"
          git add public/assets public/review "$RUN_DIR/asset-persistence-receipt.json" "$RUN_DIR/production-receipt.json"
          git commit -m "Produce Atlas review candidate assets and reader"
          git push origin HEAD:test/automated-edition-1
        env:
          RUN_DIR: ${{ inputs.run_dir || 'content/AUTOMATED-TEST-001' }}
      - name: Deploy, inspect and repair bounded defects
        run: python3 tools/review_loop.py "$RUN_DIR"
        env:
          RUN_DIR: ${{ inputs.run_dir || 'content/AUTOMATED-TEST-001' }}
      - name: Publication completeness gate
        run: python3 tools/publication_gate.py "$RUN_DIR"
        env:
          RUN_DIR: ${{ inputs.run_dir || 'content/AUTOMATED-TEST-001' }}
      - name: Store inspectable receipts and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atlas-production-receipts
          path: |
            ${{ inputs.run_dir || 'content/AUTOMATED-TEST-001' }}/*receipt.json
            ${{ inputs.run_dir || 'content/AUTOMATED-TEST-001' }}/rendered-qa.json
            ${{ inputs.run_dir || 'content/AUTOMATED-TEST-001' }}/visual-review.json
            ${{ inputs.run_dir || 'content/AUTOMATED-TEST-001' }}/benchmark-parity.json
            ${{ inputs.run_dir || 'content/AUTOMATED-TEST-001' }}/screenshots/*.png
