name: Atlas edition production candidate
on:
  push:
    branches: [test/automated-edition-1]
    paths:
      - '.github/workflows/atlas-edition-production.yml'
      - 'tools/**'
      - 'tests/**'
      - 'atlas/contracts/manufacturing-trace.json'
      - 'public/review/reader-production.*'
      - 'content/AUTOMATED-TEST-001/**'
  workflow_dispatch:
    inputs:
      run_dir:
        description: Repository directory with approved candidate and stage receipts
        required: true
        default: content/AUTOMATED-TEST-001
concurrency:
  group: atlas-production-test-1
  cancel-in-progress: false
jobs:
  produce-and-review:
    if: github.ref == 'refs/heads/test/automated-edition-1'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    env:
      OPENAI_API_KEY: ${{ secrets.ATLASOQUENCE_GITHUB_PRODUCTION }}
      RENDER_API_KEY: ${{ secrets.ATLASOQUENCE_GITHUB_ACTIONS }}
      ATLAS_SAFE_VISUAL_REEXPRESSION: '1'
      ATLAS_IMAGE_COMMAND: python3 tools/image_provider_openai.py
      ATLAS_VISUAL_QA_COMMAND: python3 tools/visual_verifier_openai.py
      ATLAS_BENCHMARK_URL: https://atlas-of-consequences.onrender.com/adaptive/
      NODE_PATH: /tmp/atlas-playwright/node_modules
      RUN_DIR: ${{ inputs.run_dir || 'content/AUTOMATED-TEST-001' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: true
      - name: Bind execution to test branch
        run: |
          test "$RUN_DIR" = content/AUTOMATED-TEST-001 || { echo 'BLOCKED: run directory is outside this test'; exit 1; }
          git switch -C test/automated-edition-1
          git config user.name atlas-production-worker
          git config user.email atlas-production-worker@users.noreply.github.com
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install validation dependency
        run: python3 -m pip install Pillow
      - name: Verify manufacturing coverage and negative gates
        run: |
          python3 tools/validate_manufacturing_trace.py
          python3 -m unittest discover -s tests -v
      - name: Verify production capabilities
        id: capabilities
        run: python3 tools/production_preflight.py "$RUN_DIR"
      - name: Install browser dependencies
        run: |
          npm install --prefix /tmp/atlas-playwright playwright
          /tmp/atlas-playwright/node_modules/.bin/playwright install --with-deps chromium
      - name: Produce verified copy, actual assets and reader
        run: python3 tools/produce_edition.py "$RUN_DIR"
      - name: Verify source accessibility
        run: python3 tools/source_qa.py "$RUN_DIR"
      - name: Persist binaries and reader on test branch
        run: |
          git add public/assets public/review "$RUN_DIR"
          if ! git diff --cached --quiet; then
            git commit -m 'Produce Atlas review candidate assets and reader [skip ci]'
            git push origin HEAD:test/automated-edition-1
          fi
      - name: Deploy, inspect and repair bounded defects
        run: python3 tools/review_loop.py "$RUN_DIR"
      - name: Publication completeness gate
        if: always()
        run: python3 tools/publication_gate.py "$RUN_DIR"
      - name: Persist partial assets and production receipts
        if: always()
        run: |
          git add public/assets public/review "$RUN_DIR" ':!**/screenshots/**'
          if ! git diff --cached --quiet; then
            git commit -m 'Record Atlas production verdict [skip ci]'
            git push origin HEAD:test/automated-edition-1
          fi
      - name: Store inspectable receipts and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atlas-production-receipts
          path: |
            public/assets/aet1-wc-002/
            ${{ env.RUN_DIR }}/*.json
            ${{ env.RUN_DIR }}/screenshots/*.png
