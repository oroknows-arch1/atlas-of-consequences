name: Atlas edition production candidate
on:
  push:
    branches: [test/automated-edition-1]
    paths:
      - '.github/workflows/atlas-edition-production.yml'
      - 'tools/**'
      - 'tests/**'
      - 'atlas/contracts/manufacturing-trace.json'
      - 'atlas/contracts/reader-grammar.json'
      - 'public/review/adaptive.js'
      - 'public/review/edition.css'
      - 'public/adaptive/adaptive.css'
      - 'content/AUTOMATED-TEST-001/**'
  workflow_dispatch:
    inputs:
      run_dir:
        description: Repository directory with approved candidate and stage receipts
        required: true
        default: content/AUTOMATED-TEST-001
concurrency:
  group: atlas-production-test-1
  cancel-in-progress: true
jobs:
  produce-and-review:
    if: github.ref == 'refs/heads/test/automated-edition-1'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      ATLAS_READER_ONLY: '1'
      ATLAS_ALLOW_COVERAGE_GENERATION: '0'
      NODE_PATH: /tmp/atlas-playwright/node_modules
      RUN_DIR: ${{ inputs.run_dir || 'content/AUTOMATED-TEST-001' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/automated-edition-1
          persist-credentials: true
      - name: Bind execution to test branch
        run: |
          test "$RUN_DIR" = content/AUTOMATED-TEST-001 || { echo 'BLOCKED: run directory is outside this test'; exit 1; }
          git switch -C test/automated-edition-1
          git config user.name atlas-production-worker
          git config user.email atlas-production-worker@users.noreply.github.com
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install validation dependency
        run: python3 -m pip install Pillow
      - name: Verify manufacturing coverage and negative gates
        run: |
          python3 tools/validate_manufacturing_trace.py
          python3 -m unittest discover -s tests -v
      - name: Install browser dependencies
        run: |
          npm install --prefix /tmp/atlas-playwright playwright
          /tmp/atlas-playwright/node_modules/.bin/playwright install --with-deps chromium
      - name: Build inherited reader with persisted assets
        run: python3 tools/early_reader_gate.py "$RUN_DIR"
      - name: Render and verify structural checkpoint
        run: node tools/early_render_gate.cjs "$RUN_DIR"
      - name: Assemble from all persisted verified beats
        run: python3 tools/assemble_verified_reader.py "$RUN_DIR"
      - name: Verify every rendered route and asset
        run: node tools/full_render_gate.cjs "$RUN_DIR"
      - name: Deploy inherited reader to isolated review service
        env:
          RENDER_API_KEY: ${{ secrets.ATLASOQUENCE_GITHUB_ACTIONS }}
        run: python3 tools/deploy_review.py "$RUN_DIR"
      - name: Render every route on deployed review site
        run: node tools/full_render_gate.cjs "$RUN_DIR" --live
      - name: Independently inspect deployed visuals
        env:
          OPENAI_API_KEY: ${{ secrets.ATLASOQUENCE_GITHUB_PRODUCTION }}
        run: python3 tools/review_inherited_live.py "$RUN_DIR"
      - name: Check publication candidate completeness
        run: python3 tools/publication_gate_inherited.py "$RUN_DIR"
      - name: Persist verified reader checkpoint
        if: always()
        run: |
          git add public/review "$RUN_DIR/early-reader-gate.json" "$RUN_DIR/full-reader-gate.json" "$RUN_DIR/production-receipt.json" "$RUN_DIR/visual-coverage.json" "$RUN_DIR/opening-system.json" "$RUN_DIR/deployment-receipt.json" "$RUN_DIR/live-reader-gate.json" "$RUN_DIR/visual-review.json" "$RUN_DIR/publication-candidate-receipt.json"
          if ! git diff --cached --quiet; then
            git commit -m 'Verify inherited AOC reader structural checkpoint [skip ci]'
            git push origin HEAD:test/automated-edition-1
          fi
      - name: Store rendered gate screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atlas-early-reader-gate
          path: |
            ${{ env.RUN_DIR }}/early-reader-gate.json
            ${{ env.RUN_DIR }}/early-gate-shots/*.png
            ${{ env.RUN_DIR }}/full-reader-gate.json
            ${{ env.RUN_DIR }}/full-gate-shots/*.png
            ${{ env.RUN_DIR }}/deployment-receipt.json
            ${{ env.RUN_DIR }}/live-reader-gate.json
            ${{ env.RUN_DIR }}/live-gate-shots/*.png
            ${{ env.RUN_DIR }}/visual-review.json
            ${{ env.RUN_DIR }}/publication-candidate-receipt.json
