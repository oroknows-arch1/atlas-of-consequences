name: Validate Atlas worker graph

on:
  pull_request:
    paths:
      - 'atlas/**'
      - 'tools/validate_atlas_graph.py'
      - 'tools/build_signal_library.py'
      - 'tools/validate_signal_priority.py'
      - 'tools/validate_relevance_routing.py'
      - 'tools/validate_destination_discovery.py'
      - 'tools/validate_route_decision.py'
      - 'tools/validate_variant_factory.py'
      - 'tools/validate_format_workers.py'
      - 'tools/validate_destination_adapter.py'
      - 'tools/validate_distribution_gates.py'
      - 'tools/validate_controlled_live_test.py'
      - 'tools/validate_execution_gateway.py'
      - 'tools/validate_reader_invariants.py'
      - 'tools/validate_opening_controls.py'
      - 'ATLAS-OPERATING-MODEL.md'
      - 'content/AOC-001/**'
      - 'public/**'
  push:
    branches: [main]
    paths:
      - 'atlas/**'
      - 'tools/validate_atlas_graph.py'
      - 'tools/validate_reader_invariants.py'
      - 'tools/validate_opening_controls.py'
      - 'ATLAS-OPERATING-MODEL.md'
      - 'content/AOC-001/**'
      - 'public/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate worker, skills, authority, graph and AOC-001 binding
        run: python3 tools/validate_atlas_graph.py
      - name: Validate deterministic AOC-001 Signal Library
        run: python3 tools/build_signal_library.py --check
      - name: Validate AOC-001 Signal Priority proof
        run: python3 tools/validate_signal_priority.py
      - name: Validate AOC-001 Relevance Routing proof
        run: python3 tools/validate_relevance_routing.py
      - name: Validate AOC-001 Destination Discovery proof
        run: python3 tools/validate_destination_discovery.py
      - name: Validate AOC-001 Route Decision proof
        run: python3 tools/validate_route_decision.py
      - name: Validate AOC-001 Variant Factory proof
        run: python3 tools/validate_variant_factory.py
      - name: Validate AOC-001 Format Workers proof
        run: python3 tools/validate_format_workers.py
      - name: Validate AOC-001 Destination Adapter proof
        run: python3 tools/validate_destination_adapter.py
      - name: Validate AOC-001 distribution gates proof
        run: python3 tools/validate_distribution_gates.py
      - name: Validate controlled AOC-001 live-test harness
        run: python3 tools/validate_controlled_live_test.py
      - name: Validate distribution Execution Gateway
        run: python3 tools/validate_execution_gateway.py
      - name: Validate human-approved AOC-001 reader invariants
        run: python3 tools/validate_reader_invariants.py
      - name: Validate approved opening control position
        run: python3 tools/validate_opening_controls.py
