<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#15252a"/><path d="M90 230H1510" stroke="#d5874a" stroke-width="5"/><text x="90" y="110" font-family="sans-serif" font-size="26" letter-spacing="5" fill="#ecb98c">ATLASOQUENCE · EXPLANATORY</text><text x="90" y="355" font-family="Georgia,serif" font-size="110" fill="#f3eadb">250 million</text><g font-family="Georgia,serif" font-size="48" fill="#f3eadb"><text x="90" y="465">This modeled figure is not a direct measurement</text><text x="90" y="530">of every workplace, but it is a clear indicator</text><text x="90" y="595">of how persistent heat now acts as a</text><text x="90" y="660">macroeconomic constraint</text></g><text x="90" y="810" font-family="sans-serif" font-size="24" fill="#e2dccf">Scope: national model estimate, 2024 · Source: WB-HEAT-2025</text></svg>